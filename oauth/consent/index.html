<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>อนุญาตการเข้าถึง · NephroBreath</title>
<meta name="theme-color" content="#1F4B3C">
<link rel="stylesheet" href="../../Style/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../../supabase-config.js"></script>
</head>
<body>

<div class="auth-screen" id="screen" style="display:flex;">
  <div class="card auth-card" id="card">
    <div class="brand" style="justify-content:center;margin-bottom:18px;">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21c4-3 7-6.5 7-11a7 7 0 1 0-14 0c0 4.5 3 8 7 11Z"/><path d="M9.5 12c1 1.2 2 1.2 3 0"/></svg>
      </div>
      <div class="brand-name">NephroBreath</div>
    </div>

    <!-- ===== loading ===== -->
    <div id="stateLoading">
      <h3>กำลังตรวจสอบคำขอ...</h3>
    </div>

    <!-- ===== error ===== -->
    <div id="stateError" style="display:none;">
      <h3>เกิดข้อผิดพลาด</h3>
      <div class="auth-error" id="errorText" style="display:block;"></div>
    </div>

    <!-- ===== login / signup (reuses the same account system as the dashboard) ===== -->
    <div id="stateAuth" style="display:none;">
      <h3 id="authTitle">เข้าสู่ระบบเพื่อดำเนินการต่อ</h3>
      <div class="field" style="text-align:left;">
        <label>อีเมล</label>
        <input type="email" id="authEmail" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="field" style="text-align:left;">
        <label>รหัสผ่าน</label>
        <input type="password" id="authPassword" placeholder="••••••••" autocomplete="current-password">
      </div>
      <div class="auth-error" id="authError" style="display:none;"></div>
      <button class="btn btn-primary btn-block" id="authSubmitBtn" onclick="handleAuthSubmit()">เข้าสู่ระบบ</button>
      <div class="auth-switch">
        <span id="authSwitchText">ยังไม่มีบัญชี?</span>
        <span class="link" id="authSwitchLink" onclick="toggleAuthMode()">สมัครสมาชิก</span>
      </div>
    </div>

    <!-- ===== consent ===== -->
    <div id="stateConsent" style="display:none;">
      <h3>อนุญาตให้เข้าถึงบัญชีของคุณ?</h3>
      <p style="font-size:13.5px;color:var(--muted);line-height:1.6;margin:0 0 18px;">
        แอป <strong id="clientName"></strong> ขอเข้าถึงบัญชี
        <strong id="accountEmailText"></strong> ของคุณ
      </p>
      <div class="field" style="text-align:left;" id="scopeField">
        <label>สิทธิ์ที่ขอ</label>
        <ul id="scopeList" style="margin:0;padding-left:18px;font-size:13px;color:var(--ink);line-height:1.8;"></ul>
      </div>
      <div class="auth-error" id="consentError" style="display:none;"></div>
      <button class="btn btn-primary btn-block" id="approveBtn" onclick="handleDecision('approve')" style="margin-bottom:10px;">อนุญาต</button>
      <button class="btn btn-ghost btn-block" id="denyBtn" onclick="handleDecision('deny')">ปฏิเสธ</button>
      <div class="auth-switch">
        <span class="link" onclick="switchAccount()">ไม่ใช่คุณ? ออกจากระบบ</span>
      </div>
    </div>
  </div>
</div>

<script>
const sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

const params = new URLSearchParams(window.location.search);
const authorizationId = params.get('authorization_id');

let authMode = 'login';
let authDetails = null;

function showState(name){
  ['stateLoading','stateError','stateAuth','stateConsent'].forEach(id=>{
    document.getElementById(id).style.display = id === name ? 'block' : 'none';
  });
}

function showError(message){
  document.getElementById('errorText').textContent = message;
  showState('stateError');
}

function toggleAuthMode(){
  authMode = authMode === 'login' ? 'signup' : 'login';
  document.getElementById('authSubmitBtn').textContent = authMode==='login' ? 'เข้าสู่ระบบ' : 'สมัครสมาชิก';
  document.getElementById('authSwitchText').textContent = authMode==='login' ? 'ยังไม่มีบัญชี?' : 'มีบัญชีอยู่แล้ว?';
  document.getElementById('authSwitchLink').textContent = authMode==='login' ? 'สมัครสมาชิก' : 'เข้าสู่ระบบ';
  const err = document.getElementById('authError');
  err.style.display = 'none';
}

async function handleAuthSubmit(){
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const errEl = document.getElementById('authError');
  errEl.style.color = '#B14B36';
  errEl.style.display = 'none';

  if(!email || !password){
    errEl.textContent = 'กรุณากรอกอีเมลและรหัสผ่าน';
    errEl.style.display = 'block';
    return;
  }

  const { error } = authMode === 'login'
    ? await sb.auth.signInWithPassword({ email, password })
    : await sb.auth.signUp({ email, password });

  if(error){
    errEl.textContent = error.message;
    errEl.style.display = 'block';
    return;
  }

  if(authMode === 'signup'){
    errEl.style.color = 'var(--forest)';
    errEl.textContent = 'สมัครสำเร็จ กรุณาเข้าสู่ระบบ (หรือยืนยันอีเมลก่อน หากเปิดใช้งานอยู่)';
    errEl.style.display = 'block';
    return;
  }

  await loadAuthorization();
}

async function switchAccount(){
  await sb.auth.signOut();
  showState('stateAuth');
}

async function loadAuthorization(){
  if(!authorizationId){
    showError('ลิงก์นี้ไม่สมบูรณ์ ไม่พบ authorization_id');
    return;
  }

  const { data: { user } } = await sb.auth.getUser();
  if(!user){
    showState('stateAuth');
    return;
  }

  showState('stateLoading');

  const { data, error } = await sb.auth.oauth.getAuthorizationDetails(authorizationId);

  if(error){
    showError(error.message || 'ไม่สามารถโหลดคำขอนี้ได้');
    return;
  }

  // User already approved this request previously — Supabase returns a
  // redirect_url directly instead of authorization details to show again.
  if(!('authorization_id' in data)){
    window.location.href = data.redirect_url;
    return;
  }

  authDetails = data;
  document.getElementById('clientName').textContent = data.client?.name || 'แอปพลิเคชันภายนอก';
  document.getElementById('accountEmailText').textContent = user.email;

  const scopes = (data.scope || '').trim();
  const scopeField = document.getElementById('scopeField');
  const scopeList = document.getElementById('scopeList');
  scopeList.innerHTML = '';
  if(scopes){
    scopes.split(' ').forEach(s=>{
      const li = document.createElement('li');
      li.textContent = s;
      scopeList.appendChild(li);
    });
    scopeField.style.display = 'block';
  } else {
    scopeField.style.display = 'none';
  }

  showState('stateConsent');
}

async function handleDecision(decision){
  const errEl = document.getElementById('consentError');
  errEl.style.display = 'none';
  document.getElementById('approveBtn').disabled = true;
  document.getElementById('denyBtn').disabled = true;

  const { data, error } = decision === 'approve'
    ? await sb.auth.oauth.approveAuthorization(authorizationId)
    : await sb.auth.oauth.denyAuthorization(authorizationId);

  if(error){
    errEl.textContent = error.message || 'ดำเนินการไม่สำเร็จ';
    errEl.style.display = 'block';
    document.getElementById('approveBtn').disabled = false;
    document.getElementById('denyBtn').disabled = false;
    return;
  }

  window.location.href = data.redirect_url;
}

sb.auth.onAuthStateChange((event, session)=>{
  if(session) loadAuthorization();
});

loadAuthorization();
</script>

</body>
</html>
